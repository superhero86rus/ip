apiVersion: apps/v1
kind: Deployment
metadata:
  name: ip-app-doc-converter
  labels:
    app: ip-app-doc-converter
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: ip-app-doc-converter
      GPBApp: ip-app-doc-converter
      GPBAppVer: gpb
      GPBEnvironment: gpb1
  template:
    metadata:
      labels:
        app: ip-app-doc-converter
        GPBApp: ip-app-doc-converter
        GPBAppVer: gpb
        GPBEnvironment: gpb1
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ip-app-doc-converter
        image: superhero86/ip-app-doc-converter:9.3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "500m"
        ports:
        - containerPort: 8084
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
