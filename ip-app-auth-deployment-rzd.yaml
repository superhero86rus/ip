apiVersion: apps/v1
kind: Deployment
metadata:
  name: ip-app-auth
  labels:
    app: ip-app-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ip-app-auth
  template:
    metadata:
      labels:
        app: ip-app-auth
    spec:
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: ip-app-auth
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      containers:
        - name: ip-app-auth
          image: nexus.rzd/asupacdi-auth:latest
          ports:
            - containerPort: 8088
          livenessProbe:
            httpGet:
              port: 8088
              path: /actuator/health/liveness
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 3
            timeoutSeconds: 30
          env:
            - name: IP_APP_DB_HOST
              valueFrom:
                configMapKeyRef:
                  key: IP_APP_DB_HOST
                  name: ip-app-db-configmap
            - name: IP_APP_DB_PORT
              valueFrom:
                configMapKeyRef:
                  key: IP_APP_DB_PORT
                  name: ip-app-db-configmap
            - name: IP_APP_DB_NAME
              valueFrom:
                configMapKeyRef:
                  key: IP_APP_DB_NAME
                  name: ip-app-db-configmap
            - name: IP_APP_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: IP_APP_DB_USERNAME
                  name: ip-app-db-configmap
            - name: IP_APP_DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: IP_APP_DB_PASSWORD
                  name: ip-app-db-configmap
            - name: IP_APP_LICENSE
              valueFrom:
                configMapKeyRef:
                  key: IP_APP_LICENSE
                  name: ip-app-license-configmap
            - name: IP_APP_AUTH_SYSTEM_KEY
              valueFrom:
                configMapKeyRef:
                  key: IP_APP_AUTH_SYSTEM_KEY
                  name: ip-app-auth-configmap
            - name: IP_APP_SECURITY_FAILED_LOGIN_LOCK_INTERVAL
              valueFrom:
                configMapKeyRef:
                  key: IP_APP_SECURITY_FAILED_LOGIN_LOCK_INTERVAL
                  name: ip-app-auth-configmap
